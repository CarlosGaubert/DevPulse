services:
  - type: web
    name: devpulse
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    plan: free
    healthCheckPath: /api/scheduler/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SYNC_INTERVAL_MINUTES
        value: 15
      - key: DEVPULSE_DB_PATH
        value: data/devpulse.sqlite3
